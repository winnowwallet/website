name: Website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: false
      - name: Validate site and historical evidence
        run: |
          python3 -m unittest discover -s scripts/tests
          scripts/build-site --check
          scripts/check-site
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: website
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Prepare deployment tool
        run: printf '{"private":true}\n' > package.json
      # The site is the committed docs/ that the check above validated, at the same commit;
      # the deploy checks it out itself rather than passing it as an artifact, so the private
      # repository's artifact storage quota cannot stop a deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: false
          path: source
      - name: The site to deploy
        run: mv source/docs site && rm -rf source
      - name: Deploy Winnow website
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.125.0'
          command: pages deploy site --project-name=winnow --branch=main --commit-dirty=true
